<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Table</title>
<link rel="stylesheet" href="/web/style.css">
<script src="/web/static-api.js"></script>
<style>
  .book { max-width: 460px; margin: 32px auto; }
  .book label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 4px; }
  .book input, .book select, .book textarea { width: 100%; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result { margin-top: 16px; padding: 12px; border-radius: 8px; font-weight: 600; }
  .result.ok { background: var(--ok-bg); color: var(--ok); } .result.bad { background: var(--bad-bg); color: var(--bad); }
  .alts button { margin: 6px 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card book">
    <h1>Book a table at Casa Demo</h1>
    <p class="muted" style="margin:4px 0 0">Tonight, Wednesday Oct 7. Booking direct, no third-party account needed. This page shares one book with the <a href="/app.html" style="color:inherit">host dashboard</a>.</p>
    <form id="f">
      <div class="row">
        <div><label for="party">Guests</label><select id="party"></select></div>
        <div><label for="time">Time</label><select id="time"></select></div>
      </div>
      <label for="name">Name</label><input id="name" required autocomplete="name" placeholder="Your name">
      <label for="phone">Mobile (we'll text to confirm)</label><input id="phone" required type="tel" autocomplete="tel" placeholder="(212) 555-0123">
      <label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email">
      <label for="notes">Notes (optional)</label><input id="notes" placeholder="Allergies, occasion…">
      <div style="margin-top:16px"><button class="primary" style="width:100%">Reserve</button></div>
    </form>
    <div id="out"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("#party").innerHTML = [1,2,3,4,5,6,7,8].map((p) => `<option ${p === 2 ? "selected" : ""}>${p}</option>`).join("");
fetch("/api/slots").then((r) => r.json()).then((s) => {
  $("#time").innerHTML = s.map((t) => `<option ${t === "19:30" ? "selected" : ""}>${t}</option>`).join("");
});

async function book() {
  const body = { name: $("#name").value, phone: $("#phone").value, email: $("#email").value,
                 notes: $("#notes").value, party: $("#party").value, time: $("#time").value };
  const r = await (await fetch("/api/book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
  if (r.error) { $("#out").innerHTML = `<div class="result bad">${esc(r.error)}</div>`; return; }
  if (r.booked) {
    $("#out").innerHTML = `<div class="result ok">✓ You're booked: ${esc(body.party)} guests at ${esc(body.time)} tonight.<br>
      Confirmation ${esc(r.confirmation)}. We'll text ${esc(body.phone)} to confirm.</div>`;
    $("#f").reset();
  } else {
    $("#out").innerHTML = `<div class="result bad">Sorry, ${esc(body.time)} is full for ${esc(body.party)}.
      ${r.alternatives.length ? `<div class="alts">Available: ${r.alternatives.map((t) => `<button type="button" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : "Nothing else tonight."}</div>`;
    document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { $("#time").value = b.dataset.t; book(); });
  }
}
$("#f").addEventListener("submit", (e) => { e.preventDefault(); book(); });
</script>
</body>
</html>
